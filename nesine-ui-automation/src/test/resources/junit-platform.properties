# Cucumber JUnit Platform Engine Configuration
cucumber.publish.quiet=true
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.glue=stepdefinitions
cucumber.features=src/test/resources/features

# Parallel execution configuration (disabled by default, can be enabled via -Dcucumber.execution.parallel.enabled=true)
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1.0
